name: Check CC:Tweaked Lua syntax
on:
  push:
    paths:
      - 'cc-mekanism/**'
      - '.github/workflows/cc-mekanism-lua.yml'
  pull_request:
    paths:
      - 'cc-mekanism/**'
      - '.github/workflows/cc-mekanism-lua.yml'
  workflow_dispatch:
jobs:
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.2 parser
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.2
      - name: Parse all CC Mekanism Lua scripts
        run: |
          set -e
          for f in cc-mekanism/*.lua; do
            echo "Syntax checking $f"
            luac5.2 -p "$f"
          done
